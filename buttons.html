<style>
  .subscribe {
    background-color: #c21e1e;
    border: none;
    color: white;
    padding: 10px 20px;
    text-align: center;
    text-decoration: none;
    display: inline-block;
    font-size: 20px;
    margin: 4px 2px;
    height: 50px;
    width: 150px;
    cursor: pointer;
    border-radius: 4px;
    transition: background-color 0.15s, color 0.15s, border-color 0.15s;
  }
  .subscribe:hover {
    opacity: 0.8;
  }
  .subscribe:active {
    opacity: 0.6;
  }
  .join {
    background-color: white;
    border: 2px solid #1e7ec2;
    color: #1e7ec2;
    padding: 10px 10px;
    text-align: center;
    text-decoration: none;
    display: inline-block;
    font-size: 20px;
    margin: 4px 2px;
    height: 50px;
    width: 80px;
    cursor: pointer;
    border-radius: 8px;
    transition: background-color 0.3s, color 0.3s, border-color 0.3s;
  }
  .join:hover {
    background-color: #1e7ec2;
    color: white;
    border: 2px solid #1e7ec2;
  }
  .join:active {
    opacity: 0.6;
  }

    .tweet {
        background-color: #1da1f2;
        border: none;
        color: white;
        text-align: center;
        text-decoration: none;
        display: inline-block;
        font-size: 20px;
        font-weight: bold;
        font: 20px tahoma, sans-serif;
        margin: 4px 2px;
        height: 50px;
        width: 130px;
        cursor: pointer;
        border-radius: 24px;
        transition: box-shadow 0.2s ease-in-out;
    }
    .tweet:hover {
        box-shadow: 0 4px 10px #999;
    }
    .addtocart {
        background-color: #d4ab39;
        border: none;
        color: rgb(0, 0, 0);
        text-align: center;
        text-decoration: none;
        display: inline-block;
        font-size: 20px;
        font-weight: bold;
        font: 20px tahoma, sans-serif;
        margin: 4px 2px;
        height: 50px;
        width: 350px;
        cursor: pointer;
        border-radius: 24px;
        transition: border 0.1s ease-in-out, background-color 0.1s ease-in-out;
    }
    .addtocart:hover {
        border: 2px solid #000000;
        background-color: #cc9a1a;
    }
    .addtocart:active {
        opacity: 0.6;
    }
</style>

  <button class="tweet">TWEET</button>
  <button class="addtocart">ADD TO CART</button>
</div>
